[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritraj"
version = "0.1.0"
description = "Incremental constraint verification and record-level curation of LLM agent trajectory data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hf = ["transformers>=4.44"]
torch = ["torch>=2.2"]

[project.scripts]
veritraj = "veritraj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
