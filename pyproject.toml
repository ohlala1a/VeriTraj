[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritraj"
version = "0.1.0"
description = "Incremental constraint verification and record-level curation of LLM agent trajectory data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hf = ["transformers>=4.44"]
torch = ["torch>=2.2"]
train = ["torch>=2.2", "transformers>=4.44", "peft>=0.13", "numpy>=1.26"]
vllm = ["vllm>=0.6"]
alfworld = ["alfworld>=0.3", "textworld>=1.6"]
cyberbattle = ["gymnasium>=0.29", "numpy>=1.26", "networkx>=3.0"]

[project.scripts]
veritraj = "veritraj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
